# Status line style and color
## Left
set -g status-left " #[fg=${fg},bg=${bg}]  #S "
set -g window-status-current-format "#[nounderscore] #I:#W"
set -g window-status-format " #I:#W"

## Right
set -g status-right-length 60
set -g status-right "⏱ %H:%M 🗓 %Y-%b-%d "
set -g status-style "fg=${fg},bg=${bg}"

set -g tree-mode-selection-style "fg=${fg},bg=${bg}"
set -g switch-mode-match-style "fg=${fg},bg=${bg}"
set -g mode-style "noattr,fg=${fg},bg=${bg}"
set -g menu-selected-style "fg=${blue},bg=${bg}"
set -g message-style "fg=${fg},bg=${bg},fill=${fill}"
