# Tmux settings
unbind C-b
set -g prefix C-f

set -g status-key vi
set -g mode-keys vi

set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1

set -g history-limit 10000

setw -g monitor-activity on
set -g visual-activity on

set -g default-command bash
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g extended-keys on
set -g extended-keys-format csi-u

# Better keybinds for spliting panes
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# moving between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# moving between windows with vim movement keys
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# resize panes with vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-position bottom
set -g status-interval 1

set -g status-right-length 60
set -g status-right "%H:%M %Y-%b-%d"
# set -g status-right "Star Wars day: [#(countdown 11:11:11 May 4 2023)] #(pomo print) %H:%M %Y-%b-%d"

# Theme
set -s theme dark

set -g dark-theme-black "#A2A2A2"
set -g dark-theme-white "#202022"
